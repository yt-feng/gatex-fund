name: secondary-snapshot

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-source-state-main
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_SECONDARY_SNAPSHOT == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install egress client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shadowsocks-libev
      - name: Install runtime
        run: |
          python3 -m pip install --disable-pip-version-check .
          python3 -m playwright install --with-deps chromium
      - name: Run sealed snapshot
        env:
          PYTHONPATH: src
          RUNTIME_AGE_IDENTITY: ${{ secrets.RUNTIME_AGE_IDENTITY }}
          EGRESS_PROXY_URI: ${{ secrets.EGRESS_PROXY_URI }}
          SNAPSHOT_PROFILE_ROOT: sealed/archive-sources/source-b
          SNAPSHOT_VAULT_DIR: vault-secondary/source-b
          SNAPSHOT_INTAKE_MODE: "off"
        run: xvfb-run -a bash scripts/run_scheduled.sh
      - name: Upload sealed diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-secondary-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-diagnostic.tar.age
          if-no-files-found: warn
          retention-days: 1
