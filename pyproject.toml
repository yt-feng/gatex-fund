[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "snapshot-pipeline"
version = "0.1.0"
description = "A provider-neutral sealed snapshot runner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
snapshot-pipeline = "snapshot_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

