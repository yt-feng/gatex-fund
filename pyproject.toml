[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "snapshot-pipeline"
version = "0.1.0"
description = "A provider-neutral sealed snapshot runner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4==4.14.3",
  "playwright==1.62.0",
  "PySocks==1.7.1",
  "requests==2.32.5",
]

[project.scripts]
snapshot-pipeline = "snapshot_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
